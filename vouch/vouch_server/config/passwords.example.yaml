# Template for config/passwords.yaml (which is gitignored and never committed).
# Create the real file with:   ./tool/setup_passwords.sh
# It copies this layout and replaces every CHANGE_ME with a fresh random value.
# Placeholders only: nothing in this file is a real secret.

development:
  # Nebius Token Factory API key (Nemotron). Optional for local runs: without a
  # real key, plain-language rule compilation (Rules tab "Preview") and unknown
  # tool classification fail with a clear message; everything else works.
  nebiusApiKey: 'YOUR_NEBIUS_TOKEN_FACTORY_KEY'
  database: 'CHANGE_ME'
  redis: 'CHANGE_ME'
  serviceSecret: 'CHANGE_ME'
  emailSecretHashPepper: 'CHANGE_ME'
  jwtHmacSha512PrivateKey: 'CHANGE_ME'
  jwtRefreshTokenHashPepper: 'CHANGE_ME'
  # HMAC key that signs the MCP MRTR requestState (lib/src/mcp/request_state.dart).
  mcpRequestStateSecret: 'CHANGE_ME'
  # Hosted demo household (DemoEndpoint). Off unless exactly 'true'. Works in
  # any run mode; see DEPLOY.md. Locally the DevEndpoint demo works without it.
  # demoMode: 'true'

test:
  database: 'CHANGE_ME'
  redis: 'CHANGE_ME'
  emailSecretHashPepper: 'CHANGE_ME'
  jwtHmacSha512PrivateKey: 'CHANGE_ME'
  jwtRefreshTokenHashPepper: 'CHANGE_ME'
  mcpRequestStateSecret: 'CHANGE_ME'
