services:
  # Development services
  postgres:
    image: ghcr.io/serverpod/postgres:16
    ports:
      - "8090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: vouch
      POSTGRES_PASSWORD: "EDPgJw5Fw-753vclwZRcJhH3e3ExSV9G"
    volumes:
      - vouch_data:/var/lib/postgresql/data

  redis:
    image: redis:6.2.6
    ports:
      - "8091:6379"
    command: redis-server --requirepass "KXD0FwYNtPlb9qhkQurcAp_N3dU2Med7"
    environment:
      - REDIS_REPLICATION_MODE=master

  # Test services
  postgres_test:
    image: ghcr.io/serverpod/postgres:16
    ports:
      - "9090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: vouch_test
      POSTGRES_PASSWORD: "MwXdeD0762o3jy6pBgtbUlwnrDCHMMKd"
    volumes:
      - vouch_test_data:/var/lib/postgresql/data

  redis_test:
    image: redis:6.2.6
    ports:
      - "9091:6379"
    command: redis-server --requirepass "4FYnTzatkOtCquy0N4p24vwOZjTMN0C4"
    environment:
      - REDIS_REPLICATION_MODE=master

volumes:
  vouch_data:
  vouch_test_data:
