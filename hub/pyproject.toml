[project]
name = "vouch-hub"
version = "0.1.0"
description = "Vouch local hub: speaker verification + signed attestations. Voiceprints never leave the box."
license = { text = "MIT" }
requires-python = ">=3.12,<3.13"
dependencies = ["cryptography", "requests", "sounddevice", "numpy", "soundfile", "rapidfuzz"]

[project.optional-dependencies]
ml = ["torch", "nemo_toolkit[asr]"]
test = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
