[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "utterance-attest"
version = "0.1.0"
description = "Sign and verify short-lived, single-utterance speaker attestations for voice agents"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "Deepak Jadhav" }]
keywords = ["voice", "attestation", "ed25519", "mcp", "speaker-verification"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
]
dependencies = [
  "cryptography>=41",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["utterance_attest*"]
